download_filename = nonfree-search-engines-data-%(version)s.tar.gz
sha256 = e14fa5b38ced15ae516143da23edcba608eea63e54960173ae8829f08efffb58
output_path = ./third_party/search_engines_data/resources_internal

[onboarding]
