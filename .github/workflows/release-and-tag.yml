name: Create new release on version bump

permissions:
  contents: write

on:
  push: { branches: ["main"] }
  workflow_dispatch:
    inputs:
      force:
        required: false
        type: boolean
        description: 'Create/trigger a release for the current version even if it already exists'
        default: false

jobs:
  check-release:
    name: Create release if it makes sense
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Check if a new release is needed
        id: info
        env:
          COMMIT_BEFORE: ${{ github.event.before }}
          COMMIT_AFTER: ${{ github.event.after }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          mkdir -p dummy && echo 0 > dummy/revision.txt
          cp utils/helium_version.py .

          if [ -n "$COMMIT_BEFORE" ] && [ -n "$COMMIT_AFTER" ]; then
            git checkout "$COMMIT_BEFORE" \
              && OLD_VERSION=$(python3 helium_version.py --tree . --print)

            git checkout "$COMMIT_AFTER" \
              && NEW_VERSION=$(python3 helium_version.py --tree . --print)
          else
            # Manual run (workflow_dispatch): there is no before/after commit
            # pair, so just use the version currently checked out.
            OLD_VERSION=""
            NEW_VERSION=$(python3 helium_version.py --tree . --print)
          fi

          if [ "$OLD_VERSION" != "$NEW_VERSION" ] || [ "$FORCE" = "true" ]; then
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            {
              printf '### Changelog\n```\n'
              git log --oneline "${OLD_VERSION:+$OLD_VERSION..}"
              echo '```'
            } | tee body.md
          fi

      - name: Create Release
        if: steps.info.outputs.version
        id: create_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.info.outputs.version }}
          name: ${{ steps.info.outputs.version }}
          body_path: body.md

      - name: Trigger helium-windows release build
        if: steps.info.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run main.yml \
            --repo ezeraiser/helium-windows \
            --field do-release=true
